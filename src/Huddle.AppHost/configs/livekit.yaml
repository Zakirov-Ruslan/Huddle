# https://github.com/livekit/livekit/blob/master/config-sample.yaml

port: 7880
bind_addresses:
    - ""
rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
    enable_loopback_candidate: false
    ips:
        includes:
            - 31.134.188.71/32
    turn_servers:
    - host: turn.anyfirewall.com
      port: 443
      protocol: tls
      username: "webrtc"
      credential: "webrtc" 



