# https://github.com/livekit/livekit/blob/master/config-sample.yaml - config sample
# https://gist.github.com/sagivo/3a4b2f2c7ac6e1b5267c2f1f59ac6c6b - public TURN servers

port: 7880
bind_addresses:
    - ""
rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
    enable_loopback_candidate: false
    ips:
        includes:
            - 31.134.188.71/32
# by default livekit uses google STUN servers
#    stun_servers: 
#    - host: stun.l.google.com
#      port: 19302
#    - host: global.stun.twilio.com
#      port: 3478
# https://webrtc.github.io/samples/src/content/peerconnection/trickle-ice/ - can test public TURN servers here
    turn_servers:
    - host: turn.bistri.com
      port: 80
      protocol: udp
      username: "homeo"
      credential: "homeo" 



